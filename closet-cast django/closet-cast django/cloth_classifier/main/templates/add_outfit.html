<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Outfit - Cloth Classifier</title>
    
    <!-- Load static files -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👕</text></svg>">
    <style>
        /* Enhance file input appearance */
        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #f9fafb;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            cursor: pointer;
        }
        input[type="file"]:hover {
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <header class="auth-header">
                <div class="logo">
                    <span class="logo-icon">👕</span>
                    <h1>Add Outfit</h1>
                </div>
                <p class="auth-subtitle">Add a new clothing item to classification history</p>
            </header>

            <main class="auth-main">
                <form method="post" enctype="multipart/form-data" class="auth-form">
                    {% csrf_token %}
                    
                    <div class="form-group">
                        <label class="form-label" style="margin-bottom: 12px;">
                            Select Clothing Image
                        </label>
                        {{ form.image }}
                    </div>

                    <button type="submit" class="auth-button" style="background: linear-gradient(135deg, #28a745, #20c997); box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);">
                        Upload & Predict
                    </button>
                </form>
            </main>

            <footer class="auth-footer">
                <div class="back-to-home">
                    <a href="{% url 'dashboard' %}" class="home-link">
                        Back to Dashboard
                    </a>
                </div>
            </footer>
        </div>
    </div>
</body>
</html>
